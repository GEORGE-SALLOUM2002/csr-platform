# ============================================================
#  Nginx — خدمة واجهة React (SPA) + تمرير الطلبات إلى الخلفية
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # الحد الأقصى لحجم الرفع (وثائق الأطباء والملفات العلمية)
    client_max_body_size 25M;

    # ضغط الاستجابات
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml application/font-woff2;

    # رؤوس أمان عامة
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # ---- الـ API ----
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    # ---- لوحة تحكم Django ----
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    # ---- ملفات Django الثابتة (لوحة الأدمن وDRF) عبر WhiteNoise ----
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ---- الوسائط العامة (صور الأطباء، أغلفة الأنشطة...) من الحجم المشترك ----
    #  ملاحظة: وثائق الاعتماد الحسّاسة ليست هنا — تُخدَم فقط عبر /api/credentials/ الموقّعة
    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- تطبيق React أحادي الصفحة (توجيه العميل) ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
