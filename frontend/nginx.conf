# ============================================================
#  Nginx — خدمة واجهة React (SPA) + تمرير الطلبات إلى الخلفية
# ============================================================
# بروتوكول الطلب الأصلي: عند وجود طبقة HTTPS أمام هذا الخادم (مثل Caddy) نمرّر
# قيمتها X-Forwarded-Proto=https كما هي؛ وإلا نستخدم بروتوكول هذا الخادم نفسه.
# بدون هذا يظن Django أن الطلب HTTP فيدخل في حلقة إعادة توجيه عند تفعيل SECURE_SSL_REDIRECT.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # الحد الأقصى لحجم الرفع (وثائق الأطباء والملفات العلمية + فيديو/صوت المحاضرات)
    #  يطابق حدّ الخلفية لملف المورد العلمي: document_validators(2000) ميغابايت
    client_max_body_size 2000M;

    # ضغط الاستجابات
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml application/font-woff2;

    # رؤوس أمان عامة
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # ---- الـ API ----
    location /api/ {
        proxy_pass http://backend:8000;
        # مهلة أطول لرفع ملفات الفيديو/الصوت الكبيرة
        client_body_timeout 300s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    # ---- لوحة تحكم Django ----
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    # ---- ملفات Django الثابتة (لوحة الأدمن وDRF) عبر WhiteNoise ----
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ---- الوسائط العامة (صور الأطباء، أغلفة الأنشطة...) من الحجم المشترك ----
    #  ملاحظة: وثائق الاعتماد الحسّاسة ليست هنا — تُخدَم فقط عبر /api/credentials/ الموقّعة
    #  ملفات المحتوى العلمي (المحاضرات/الفيديو/PDF) ممنوعة من هنا: تُعرض فقط عبر
    #  /api/resources/<id>/stream/ الموقّع (منع التحميل)
    location ^~ /media/library/ {
        return 404;
    }

    #  مسار داخلي فقط (internal): لا يمكن طلبه من المتصفح مباشرةً. يُستخدم بعد أن يتحقق
    #  Django من الرابط الموقّع ويرد بـ X-Accel-Redirect؛ فيرسل Nginx الملف بكفاءة
    #  مع دعم التقديم/التأخير في الفيديو (Range) دون أن يشغل عمّال Django.
    location ^~ /_protected/library/ {
        internal;
        alias /var/www/media/library/;
        # Content-Type و Cache-Control و Content-Disposition تأتي من رد Django نفسه
        add_header X-Content-Type-Options nosniff always;
        add_header Cross-Origin-Resource-Policy same-origin always;
    }

    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- تطبيق React أحادي الصفحة (توجيه العميل) ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
